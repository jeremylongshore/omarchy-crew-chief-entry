name: test
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Race-suite stability
        run: npm run test:race
      - name: Mutation quality floor
        run: npm run test:mutation
      - name: Deterministic audit profile
        run: npm run audit
      - name: ShellCheck runtime, developer, and E2E scripts
        run: >-
          shellcheck --severity=warning hooks/* adapters/*
          bin/crew-chief-report bin/read-spool
          scripts/*.sh e2e/*.sh .githooks/pre-push
      - name: Perl spool helper syntax
        run: perl -c bin/crew-chief-spool
      - name: Manifest and JavaScript syntax
        run: |
          jq -e '.schemaVersion == 1 and .id == "io.github.jeremylongshore.crew-chief"' manifest.json
          jq -e '.description | length == 500' manifest.json
          for f in $(git ls-files '*.js'); do node --check "$f"; done
      - name: No symlinks in the plugin tree
        run: test -z "$(find . -type l -not -path './.git/*' -not -path './node_modules/*')"
